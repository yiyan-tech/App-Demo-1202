<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档快速翻译工具</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .upload-area {
            border: 2px dashed #3498db;
            padding: 30px;
            border-radius: 5px;
            background-color: #f9fbff;
            margin-bottom: 20px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .upload-area:hover {
            background-color: #eef5fb;
        }
        input[type="file"] {
            display: none;
        }
        label {
            color: #3498db;
            cursor: pointer;
            font-weight: bold;
            display: block;
        }
        button {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #27ae60;
        }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
        }
        .error {
            background-color: #ffdddd;
            color: #d8000c;
        }
        .success {
            background-color: #ddffdd;
            color: #4f8a10;
        }
        .download-link {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .download-link:hover {
            background-color: #2980b9;
        }
        #file-name {
            margin-top: 10px;
            color: #666;
            font-size: 0.9em;
        }
        .loading {
            display: none;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 文档中译通</h1>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="message error">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% if download_file %}
            <div class="message success">
                翻译完成！
            </div>
            <a href="{{ url_for('download_file', filename=download_file) }}" class="download-link">下载翻译后的文档</a>
            <p><a href="/" style="display:block; margin-top:20px; color:#666;">翻译另一个文件</a></p>
        {% else %}
            <form method="post" enctype="multipart/form-data" id="upload-form">
                <div class="upload-area" id="drop-zone">
                    <label for="file">
                        点击选择或拖拽 .docx 文件
                    </label>
                    <input type="file" name="file" id="file" accept=".docx" required>
                    <div id="file-name"></div>
                </div>
                <button type="submit" id="submit-btn">开始翻译</button>
            </form>
            <div class="loading" id="loading-msg">正在翻译中，请稍候...</div>
        {% endif %}
    </div>

    <script>
        const fileInput = document.getElementById('file');
        const fileNameDisplay = document.getElementById('file-name');
        const form = document.getElementById('upload-form');
        const loadingMsg = document.getElementById('loading-msg');
        const submitBtn = document.getElementById('submit-btn');

        if (fileInput) {
            fileInput.addEventListener('change', function(e) {
                if (this.files && this.files.length > 0) {
                    fileNameDisplay.textContent = '已选择: ' + this.files[0].name;
                }
            });

            form.addEventListener('submit', function() {
                loadingMsg.style.display = 'block';
                submitBtn.disabled = true;
                submitBtn.innerText = '处理中...';
            });
        }
    </script>
</body>
</html>
