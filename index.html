<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语音/文字图形生成器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>图形生成器</h1>
            <p>输入文字或使用语音生成图形，并支持拖拽调整位置。</p>
        </header>

        <div class="controls">
            <input type="text" id="textInput" placeholder="请输入描述 (例如: '红色矩形' 或 '猫')">
            <button id="voiceBtn" class="btn">🎤 语音输入</button>
            <button id="generateBtn" class="btn primary">生成图形</button>
            <button id="clearBtn" class="btn danger">清空画布</button>
        </div>

        <div id="status" class="status-text">就绪</div>

        <div id="canvas-area" class="canvas-area">
            <!-- 生成的图形将放在这里 -->
            <div class="placeholder-text">在此区域生成图形</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
